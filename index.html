<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<meta name="color-scheme" content="light">
<meta name="description" content="A mid-fidelity prototype for deciding how long to wait for a bus at Toowong Village, Brisbane. Times and vehicle data are simulated.">
<title>wait or go. · Decide once, then stop checking</title>
<style>
:root{
  /* Bone paper, warm ink, one accent. Colour is spent on doubt, not on reassurance:
     a settled estimate is ink navy, never green — the "big green 3 min" is the lie
     this product is arguing against. */
  --bg:#f7f6f2; --card:#fff; --ink:#1d1c1a; --body:#403e3a; --muted:#6a665e;
  --accent:#22384f; --accent-hi:#17293a; --accent-soft:#ebeff6;   /* live, settled, decided */
  --amber:#7d5215; --amber-soft:#f8efda; --amber-line:#e3cd9b;    /* moving, past the line */
  --red:#8c3327;   --red-soft:#faeae5;                            /* cancelled */
  --grey-soft:#efede8;
  --line:#e5e2da;
  --r:22px;
}
*{box-sizing:border-box}
html{height:100%;font-size:16px;-webkit-text-size-adjust:100%}
body{min-height:100%;margin:0;background:#e6e3db;color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-align:left}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid #3f72b5;outline-offset:3px;border-radius:6px}
button:focus:not(:focus-visible){outline:none}
h1,h2,h3,p{margin:0}
svg{flex-shrink:0}
.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;
  stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:13px;height:13px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;
  padding:0!important;clip:rect(0,0,0,0)!important;overflow:hidden!important;white-space:nowrap!important}
[hidden]{display:none!important}

/* Type scale — five sizes on the main screen, nothing in between:
   11 caps label · 13 meta · 15 body · 30 bus time · 84 your line.
   The biggest number is the one that does not jitter. */
.cap{font-size:11px;font-weight:650;letter-spacing:.12em;text-transform:uppercase}
.meta{font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- device frame + demo guide ---------- */
.stage{min-height:100dvh;padding:32px 20px;display:flex;align-items:center;justify-content:center;gap:48px}
.guide{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:16px}
.guide .cap{color:var(--muted)}
.g-title{font-size:28px;font-weight:650;letter-spacing:-.035em;line-height:1.15}
.g-what{font-size:15px;line-height:1.55;color:var(--body)}
.g-what b{font-weight:650;color:var(--ink)}
.g-try{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.g-try .cap{color:var(--accent)}
.g-try p{font-size:14px;line-height:1.5;color:var(--body)}
.g-try b{font-weight:650;color:var(--accent)}
.g-nav{display:flex;gap:8px}
.g-btn{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:12px;font-size:14px;font-weight:600;
  border:1px solid #cfcabf;color:var(--body);background:transparent;text-align:center}
.g-btn:hover{background:#ecEAe3}
.g-btn.primary{flex:1;background:var(--ink);color:#fff;border-color:var(--ink)}
.g-btn.primary:hover{background:#000}
.g-btn:disabled{opacity:.35;cursor:default}
.g-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.g-step{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:0 8px;border-radius:10px;
  font-size:13px;color:var(--muted)}
.g-step:hover{background:#ecEAe3;color:var(--ink)}
.g-step .n{width:22px;height:22px;border-radius:50%;border:1px solid #cfcabf;display:grid;place-items:center;
  font-size:11px;font-weight:650;flex-shrink:0}
.g-step[aria-current=true]{color:var(--ink);font-weight:620}
.g-step[aria-current=true] .n{background:var(--ink);border-color:var(--ink);color:#fff}
.g-foot{font-size:12px;line-height:1.5;color:var(--muted)}
.g-foot button{font-size:12px;color:inherit;text-decoration:underline;text-underline-offset:2px}
.g-toggle{display:none}
.no-guide .guide{display:none}
.phone{position:relative;isolation:isolate;width:414px;height:884px;
  max-height:calc(100dvh - 64px);min-height:620px;background:var(--bg);
  border:1px solid #d5d1c7;border-radius:38px;overflow:hidden;
  box-shadow:0 0 0 7px rgba(250,249,245,.55),0 30px 80px rgba(32,28,22,.10)}
.app{height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  padding:20px 20px 12px;display:flex;flex-direction:column;gap:16px}
.app::-webkit-scrollbar{display:none}
.app > *{flex:0 0 auto}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:40px}
.wordmark{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.03em;font-size:18px}
.mark{width:32px;height:32px;border-radius:10px;background:var(--accent);color:#f4f6f9;display:grid;place-items:center}

.place{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:-4px}
.place h1{font-size:15px;font-weight:620;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.place h1 .icon{width:14px;height:14px;color:var(--muted)}

/* ---------- HERO: your line ---------- */
.hero{border-radius:var(--r);padding:20px;background:#fff;border:1.5px solid var(--accent);
  display:flex;flex-direction:column}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px}
.hero .cap{color:var(--accent);display:flex;align-items:center;gap:6px}
.by{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 10px;border-radius:999px;
  font-size:13px;font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.by:hover{filter:brightness(.96)}
.hero-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:10px}
.hero-time{font-size:84px;font-weight:580;letter-spacing:-.06em;line-height:.95;
  color:var(--accent);font-variant-numeric:tabular-nums}
.hero-in{font-size:15px;font-weight:620;color:var(--accent)}
.hero.armed .hero-in{color:#cfdae6}
.hero-time small{font-size:26px;font-weight:450;letter-spacing:-.02em;margin-left:5px}
.hero-time.word{font-size:44px;letter-spacing:-.045em;line-height:1.05;margin-top:10px}
.hero-sub{font-size:15px;line-height:1.45;color:var(--body);margin-top:8px}
.hero-sub b{font-weight:650;color:var(--ink)}

.plan{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.plan .icon{color:var(--accent)}
.plan-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.plan-t b,.plan-r b{font-size:15px;font-weight:620;color:var(--ink)}
.plan-r{text-align:right;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;
  margin-top:16px;border-radius:14px;font-size:15px;font-weight:620;background:var(--accent);color:#fff;text-align:center}
.btn:hover{background:var(--accent-hi)}
.btn .icon{width:17px;height:17px}
.btn-note{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.link{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;margin-top:4px;
  font-size:15px;font-weight:600;color:var(--accent);text-align:center;border-radius:12px}
.link:hover{background:rgba(34,56,79,.06)}

/* armed: decided, so the whole card goes solid */
.hero.armed{background:var(--accent);color:#fff}
.hero.armed .cap{color:#a9bdd1}
.hero.armed .by{background:rgba(255,255,255,.12);color:#fff}
.hero.armed .hero-time{color:#fff}
.hero.armed .hero-sub{color:#cfdae6}
.hero.armed .hero-sub b{color:#fff}
.hero.armed .plan{border-color:#3a526b}
.hero.armed .plan .icon,.hero.armed .plan b{color:#fff}
.hero.armed .plan .meta{color:#a9bdd1}
.hero.armed .btn{background:#fff;color:var(--accent)}
.hero.armed .btn:hover{background:#edf0f5}
.hero.armed .link{color:#cfdae6}
.hero.armed .link:hover{background:rgba(255,255,255,.08)}

/* past the line: ochre, because it is now asking something of you */
.hero.past{background:#fbf4e4;border-color:#cda968}
.hero.past .cap{color:var(--amber)}
.hero.past .hero-time{color:var(--amber)}
.hero.past .hero-sub{color:#5e4514}
.hero.past .plan{border-color:#ead7ae}
.hero.past .plan .icon{color:var(--amber)}
.hero.past .plan .meta{color:#7a6034}
.hero.past .btn{background:var(--amber)}
.hero.past .btn:hover{background:#65410f}
.hero.past .link{color:var(--amber)}
.hero.past .link:hover{background:rgba(125,82,21,.07)}
.hero.past .by{background:#f3e3bf;color:var(--amber)}

/* no line to show: the card steps back */
.hero.none{background:transparent;border:1px dashed #c9c4b9}
.hero.none .cap{color:var(--muted)}
.hero.none .hero-time{color:var(--ink)}
.hero.none .by{background:var(--grey-soft);color:var(--body)}

/* ---------- the bus: evidence, one level down ---------- */
.bus{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px 16px}
.bus-top{display:flex;align-items:center;gap:10px}
.route{display:inline-grid;place-items:center;min-width:42px;height:28px;padding:0 8px;border-radius:8px;
  font-weight:700;font-size:13px;background:var(--grey-soft);color:var(--ink)}
.bus-name{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;
  padding:5px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.state.drift{background:var(--amber-soft);color:var(--amber)}
.state.stale{background:var(--grey-soft);color:#5f5b53}
.state.gone{background:var(--red-soft);color:var(--red)}

.bus-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:14px}
.bus-l,.bus-r{display:flex;flex-direction:column;gap:3px}
.bus-r{text-align:right}
.bus-clock{font-size:30px;font-weight:600;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums}
.bus-clock small{font-size:15px;font-weight:450;letter-spacing:0;margin-left:3px}
.bus-clock.unknown{color:#a29d93}
.bus-clock.gone{color:var(--red)}
.bus-r b{font-size:15px;font-weight:620;font-variant-numeric:tabular-nums}
.ok{color:var(--accent);font-weight:600}
.no{color:var(--red);font-weight:600}
.warn{color:var(--amber);font-weight:600}

/* the revision trail: the history other apps discard */
.trail{width:100%;margin-top:14px;display:flex;align-items:center;gap:12px;min-height:52px;
  padding:9px 12px;border-radius:12px;background:#f4f3ef;color:#555149}
.trail:hover{filter:brightness(.98)}
.trail.warn{background:var(--amber-soft);color:var(--amber);font-weight:400}
.trail.gone{background:var(--red-soft);color:var(--red)}
.trail-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.trail-k{font-size:13px}
.trail-m{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:620;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.trail.warn .trail-m{color:#5c3c0d}
.trail.gone .trail-m{color:#6f261c}
.trail-m .icon{width:13px;height:13px}
.delta{font-size:11px;font-weight:650;padding:2px 6px;border-radius:6px;background:#ecdcb4}
.trail-go{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:600;white-space:nowrap}
.spark{display:flex;align-items:flex-end;gap:6px;height:48px;padding:0 2px}
.spark i{width:14px;border-radius:3px;background:#d3cfc5;display:block}
.spark i.up{background:var(--amber)}
.spark i.now{background:var(--accent)}
.chev{width:14px;height:14px;opacity:.6}

/* ---------- other ways: one row, the rest is a tap away ---------- */
.more{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:4px 4px}
.more .ic{width:36px;height:36px;border-radius:10px;background:var(--grey-soft);display:grid;place-items:center;color:var(--body)}
.more-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.more-t b{font-size:15px;font-weight:600}
.more-t .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.foot{display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;color:var(--muted);margin-top:auto}
.foot button{min-height:32px;text-decoration:underline;text-underline-offset:2px}
.dot{width:2px;height:2px;border-radius:50%;background:currentColor}

/* ---------- quiet mode ---------- */
.quiet-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;padding:20px 18px 40px}
.quiet-wrap .cap{color:var(--muted)}
.quiet-time{font-size:96px;font-weight:580;letter-spacing:-.06em;line-height:1;margin-top:14px;color:var(--accent);
  font-variant-numeric:tabular-nums}
.quiet-time small{font-size:30px;font-weight:450;letter-spacing:-.02em;margin-left:5px}
.quiet-msg{font-size:17px;line-height:1.45;color:var(--body);margin-top:16px}
.quiet-msg b{font-weight:650;color:var(--ink)}
.quiet-wrap .meta{margin-top:12px;max-width:250px;line-height:1.5}
.quiet-acts{width:100%;max-width:260px;margin-top:22px}

/* ---------- sheet ---------- */
.shade{position:absolute;inset:0;background:rgba(26,24,20,.36);z-index:20;animation:fade .16s ease}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--bg);
  border-radius:28px 28px 0 0;max-height:90%;display:flex;flex-direction:column;
  padding:0 20px max(20px,env(safe-area-inset-bottom));
  box-shadow:0 -10px 60px rgba(30,26,20,.14);animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(18px)}}
.sheet-grab{width:34px;height:4px;border-radius:99px;background:#d3cfc5;margin:10px auto}
.sheet-h{display:flex;align-items:center;gap:10px;padding-bottom:12px}
.sheet-h h2{font-size:22px;font-weight:640;letter-spacing:-.03em;line-height:1.2;flex:1;outline:none}
.x{width:40px;height:40px;border-radius:50%;background:#ebe8e1;display:grid;place-items:center;color:var(--body);margin-right:-4px}
.x:hover{background:#e2ded5}
.sheet-b{overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:4px;scrollbar-width:thin}
.sheet-b p{font-size:15px;line-height:1.5;color:var(--body)}
.sheet-b p.meta{font-size:13px;color:var(--muted)}
.sheet-b .cap{color:var(--muted);margin-top:4px}
.rows{display:flex;flex-direction:column}
.r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;
  border-top:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.r .k{color:var(--muted);min-width:64px}
.r .p{flex:1;font-weight:600}
.r .v{font-weight:600;text-align:right}
.r.last .p{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;
  font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.chip:hover{border-color:#ccc7bc}
.chip[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 0;border-top:1px solid var(--line)}
.opt .badge{width:38px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:var(--grey-soft);color:#5f5b53;flex-shrink:0;font-size:13px;font-weight:700}
.opt .badge .icon{width:17px;height:17px}
.opt-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.opt-t b{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.opt-r{text-align:right;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.opt-r b{font-size:15px;font-weight:620}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 6px;border-radius:5px;background:var(--grey-soft);color:#5f5b53}
.scene{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 12px;
  border-radius:14px;border:1px solid var(--line);background:#fff}
.scene:hover{border-color:#ccc7bc}
.scene[aria-current=true]{border-color:#9fb0c4;background:var(--accent-soft)}
.scene .n{width:30px;height:30px;border-radius:9px;background:var(--grey-soft);display:grid;
  place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
.scene[aria-current=true] .n{background:var(--accent);color:#fff}
.scene-t{display:flex;flex-direction:column;gap:2px}
.scene-t b{font-size:15px;font-weight:600}
.callout{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--amber-soft);
  font-size:13px;line-height:1.5;color:#5e4514}
.callout .icon{width:16px;height:16px;margin-top:1px}
.callout.calm{background:var(--accent-soft);color:#23384c}
.callout b{font-weight:650}

/* ---------- toast ---------- */
.toast{position:absolute;left:14px;right:14px;bottom:16px;z-index:30;
  background:#24231f;color:#efede7;border-radius:15px;padding:13px 15px;
  font-size:13px;line-height:1.45;box-shadow:0 10px 30px rgba(24,22,18,.30);
  animation:rise .2s ease-out;display:flex;gap:9px;align-items:flex-start}
.toast .icon{color:#9fb4c9;width:16px;height:16px;margin-top:1px}

.nojs{max-width:420px;margin:60px auto;padding:20px;font-size:15px;line-height:1.6;text-align:center;color:#403e3a}

@media (min-width:501px) and (max-height:860px){.stage{padding:20px}.phone{max-height:calc(100dvh - 40px);min-height:570px}}
@media (max-width:819px){
  .stage{flex-direction:column;justify-content:flex-start;gap:20px}
  .guide{width:100%;max-width:414px;gap:12px}
  .g-title{font-size:22px}
  .g-steps{display:none}
}
@media (max-width:500px){
  body{background:var(--bg)}
  .stage{padding:0;gap:0}
  .guide{max-width:none;padding:12px 16px 14px;background:#ebe8e0;border-bottom:1px solid #dcd8ce}
  .g-title{font-size:17px}
  .g-what,.g-try,.g-foot{display:none}
  .guide.open .g-what,.guide.open .g-try{display:flex}
  .guide.open .g-what{display:block}
  .g-toggle{display:inline-flex;align-self:flex-start;font-size:13px;font-weight:600;color:var(--accent);min-height:32px;align-items:center}
  .phone{width:100%;height:100dvh;max-height:none;min-height:0;border:0;border-radius:0;box-shadow:none}
  .app{padding:calc(14px + env(safe-area-inset-top)) 18px calc(12px + env(safe-area-inset-bottom))}
}
@media (max-width:360px){
  .app{padding-left:14px;padding-right:14px}
  .hero,.bus{padding-left:16px;padding-right:16px}
  .hero-time{font-size:72px}.hero-time.word{font-size:38px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (forced-colors:active){button,.state,.bus,.route,.hero{border:1px solid CanvasText}}
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-bus" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="17" rx="3"/><path d="M5 11h14M8 20v2m8-2v2M9 6h6"/><path d="M8.5 15h.01m7 0h.01" stroke-width="3"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="i-live" viewBox="0 0 24 24"><path d="M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14M8 8a6 6 0 0 0 0 8m8-8a6 6 0 0 1 0 8"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></symbol>

<noscript><p class="nojs">This is an interactive prototype and needs JavaScript. All services, times and vehicle positions are simulated. This is a design demonstration, not a live transport tool.</p></noscript>

<script>
'use strict';
/* ============================================================================
   wait or go. — mid-fi prototype v5
   DECO2500/7250 Team Design Proposal

   Scenario: High St / Toowong Village (stop 23), route 470 toward the city.
   Stop name, route number and the ~20-minute weekday headway are real.
   Every arrival time, vehicle position and service notice below is FABRICATED
   for demonstration. Nothing here touches a network, a location permission,
   an analytics endpoint or any browser storage. The clock only moves when you
   move it, so the same scene always shows the same thing.

   The design bet: the number will keep being wrong. Build for the decision,
   not for the prediction.

   v5 hierarchy: the walk-away line is the biggest thing on screen, because it
   is the one number that does not jitter. The bus sits one level down as the
   evidence behind it. One primary action per state; reasoning lives in sheets.
   ========================================================================== */

const $ = id => document.getElementById(id);
const ic = (n, cls='') => `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T = (h,m) => h*60+m;                       // minutes since midnight
const hm = t => `${Math.floor(t/60)%12||12}:${String(t%60).padStart(2,'0')}`;
const hhmm = (t, html=false) => {
  const p = Math.floor(t/60)%24 < 12 ? 'am' : 'pm';
  return html ? `${hm(t)}<small>${p}</small>` : `${hm(t)} ${p}`;
};
const plural = (n,w) => w==='min' ? `${n} min` : `${n} ${w}${n===1?'':'s'}`;

/* --- fixed facts for this scenario ------------------------------------- */
const ROUTE  = '470';
const HEAD   = 'City via Milton Rd';
const RIDE   = 19;                 // demo ride time, stop 23 -> Roma St
const WALK_TRAIN = 9;              // walk to Auchenflower station
const TRAIN_RIDE = 8;
const TRAINS = [T(14,49), T(15,4), T(15,19)];
const LATER_470 = [T(14,52), T(15,12)];
const RIDESHARE = { mins: 17, cost: '$24–31' };
const FARE = '50c';

/* --- the scene sequence -------------------------------------------------
   Each scene is a frozen moment. `trail` is the list of arrival estimates
   this service has published so far, oldest first, each with the wall-clock
   time it was published. That list is the thing every other app throws away.
------------------------------------------------------------------------- */
const SCENES = [
  { id:'settled', label:'A settled wait', hint:'Same time, four updates running',
    now:T(14,23), feed:T(14,22), arr:T(14,32), stops:3,
    trail:[[T(14,16),T(14,32)],[T(14,18),T(14,32)],[T(14,20),T(14,32)],[T(14,22),T(14,32)]] },

  { id:'drifting', label:'The estimate starts moving', hint:'Three revisions in nine minutes',
    now:T(14,29), feed:T(14,28), arr:T(14,38), stops:3,
    trail:[[T(14,19),T(14,32)],[T(14,22),T(14,34)],[T(14,25),T(14,36)],[T(14,28),T(14,38)]] },

  { id:'stale', label:'The feed goes quiet', hint:'Nothing heard for eight minutes',
    now:T(14,38), feed:T(14,30), arr:T(14,40), stops:3, stale:true,
    trail:[[T(14,19),T(14,32)],[T(14,22),T(14,34)],[T(14,25),T(14,36)],[T(14,30),T(14,40)]] },

  { id:'crossed', label:'Your line arrives', hint:'The bus is close and still too late',
    now:T(14,55), feed:T(14,51), arr:T(14,58), stops:1,
    trail:[[T(14,19),T(14,32)],[T(14,22),T(14,34)],[T(14,25),T(14,36)],[T(14,30),T(14,40)],
           [T(14,42),T(14,49)],[T(14,51),T(14,58)]] },

  { id:'cancelled', label:'Cancelled', hint:'Other ending · a notice, not missing data',
    now:T(14,40), feed:T(14,39), arr:null, stops:null, cancelled:true, notice:T(14,39),
    trail:[[T(14,19),T(14,32)],[T(14,22),T(14,34)],[T(14,25),T(14,36)],[T(14,30),T(14,40)]] },

  { id:'recovered', label:'It turns up', hint:'Other ending · the bus beats your line',
    now:T(14,50), feed:T(14,50), arr:T(14,53), stops:1,
    trail:[[T(14,19),T(14,32)],[T(14,22),T(14,34)],[T(14,25),T(14,36)],[T(14,30),T(14,40)],
           [T(14,44),T(14,52)],[T(14,50),T(14,53)]] }
];

/* --- mutable state ------------------------------------------------------ */
const state = {
  scene: 0,
  deadline: T(15,15),     // "I need to be in the city by 3:15"
  armed: false,           // has the rider committed to the line?
  quiet: false,           // phone-away mode
  overrode: false,        // chose to keep waiting past the line
  sheet: null,
  guideOpen: false        // narrow screens: guide text collapsed by default
};
let lastFocus = null, toastTimer = null;

/* --- derived ------------------------------------------------------------ */
const S = () => SCENES[state.scene];
const arrivesCity = () => S().arr === null ? null : S().arr + RIDE;
const feedAge = () => S().now - S().feed;
const isStale = () => !!S().stale && feedAge() >= 4;
const isGone = () => !!S().cancelled;

/** How much the estimate has moved, and whether it is settling. */
function drift() {
  const t = S().trail;
  const first = t[0][1], last = t[t.length-1][1];
  let moves = 0;
  for (let i=1;i<t.length;i++) if (t[i][1] !== t[i-1][1]) moves++;
  const span = t[t.length-1][0] - t[0][0];
  // "settling" = the last two published estimates agree
  const settling = t.length>1 && t[t.length-1][1] === t[t.length-2][1];
  return { moves, total: last-first, span, settling, first, last };
}

/** The walk-away line: the last minute at which the best backup still works.
    Backup = walk to Auchenflower + first train that gets you there in time. */
function backup() {
  if (state.deadline === null) return null;
  // latest train that still lands before the deadline
  const ok = TRAINS.filter(t => t + TRAIN_RIDE <= state.deadline);
  if (!ok.length) return null;
  const train = ok[ok.length-1];
  return {
    train,
    leaveBy: train - WALK_TRAIN,
    arrive: train + TRAIN_RIDE,
    short: `${plural(WALK_TRAIN,'min')} walk · ${hhmm(train)} train`,
    detail: `${plural(WALK_TRAIN,'min')} walk, then the ${hhmm(train)} Ipswich line`
  };
}
function theLine() {
  const b = backup();
  return b ? b.leaveBy : null;
}
const minsToLine = () => { const l = theLine(); return l === null ? null : l - S().now; };
const linePassed = () => { const m = minsToLine(); return m !== null && m <= 0; };

/** Does the bus, as currently estimated, still make the deadline? */
function busVerdict() {
  if (state.deadline === null) return { kind:'nogoal' };
  if (isGone()) return { kind:'gone' };
  if (isStale()) return { kind:'unknown' };   // an old number is not a prediction
  const a = arrivesCity();
  if (a === null) return { kind:'unknown' };
  const slack = state.deadline - a;
  if (slack >= 5)  return { kind:'fine', slack };
  if (slack >= 0)  return { kind:'tight', slack };
  return { kind:'late', slack:-slack };
}

/* --- announcements ------------------------------------------------------ */
let annTimer = null;
function announce(msg) {
  clearTimeout(annTimer);
  $('live').textContent = '';
  annTimer = setTimeout(() => { $('live').textContent = msg; }, 40);
}
function toast(msg, icon='check') {
  const el = $('toast');
  el.innerHTML = ic(icon) + `<span>${msg}</span>`;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 3600);
  announce(msg);
}

/* ========================================================================
   RENDER
   ====================================================================== */
function render() {
  $('app').innerHTML = state.quiet ? quietView() : fullView();
  renderGuide();
}

/* ---------- demo guide ---------------------------------------------------
   The app itself stays lean; the guide beside it says what each moment is
   showing and what to try. It is presentation, not product, so it lives
   outside the phone and can be hidden with ?guide=0 for clean screenshots.
------------------------------------------------------------------------- */
const GUIDE = {
  settled: {
    what: `You're at the stop and need to be in the city by <b>3:15</b>. The bus says 2:32 and hasn't changed.
      The big number isn't the bus: it's <b>the last minute you can wait</b> before walking to the train becomes the better bet.`,
    try: `Tap <b>Hold me to it</b>, then <b>Put my phone away</b>.` },
  drifting: {
    what: `The estimate keeps slipping: 2:32, 2:34, 2:36, 2:38. Other apps only show the newest number.
      We keep the history and say what it adds up to. Your line hasn't moved.`,
    try: `Tap the amber <b>History</b> strip to see every revision.` },
  stale: {
    what: `The bus hasn't reported for 8 minutes. Its old time is greyed out and marked not current, rather than
      counting down as if it were live. Your line <b>still holds</b>, because it never depended on the bus.`,
    try: `Compare the grey bus time with the unchanged 2:55.` },
  crossed: {
    what: `It's 2:55. The bus is 3 minutes away but would get you in at <b>3:17</b>, two minutes late.
      The line was set early, before the wait built up a sunk cost. Keeping on waiting is still one tap away.`,
    try: `Tap <b>Start walking</b>, or <b>Keep waiting</b> to overrule it.` },
  cancelled: {
    what: `Another ending. The operator has cancelled this trip. That's a stated fact, shown in red,
      and deliberately different from "no update", which only means we don't know.`,
    try: `Tap <b>Other ways to get there</b>. Rideshare comes last, with its price.` },
  recovered: {
    what: `Another ending. Updates come back and the bus now arrives at 2:53, before your line.
      Waiting was the right call, and the line never forced you off the bus.`,
    try: `Tap <b>Arrive by 3:15 pm</b> and pick another time to watch the line move.` }
};
function guideFor() {
  const s = S();
  if (state.quiet) return linePassed()
    ? { title:'The one interruption', what:`It's ${hhmm(s.now)} and your line has passed, so this is the moment the app speaks up. Nothing before it needed your attention.`,
        try:`Tap <b>Keep waiting</b> to overrule it, or <b>Show the detail</b>.` }
    : { title:'Phone away', what:`Once the decision is made, this is the whole app. Its success condition is you not looking at it.`,
        try:`Tap <b>Next moment</b> to jump ahead to 2:55.` };
  if (state.deadline === null) return { title:'No deadline',
    what:`A flexible trip has no line to draw, so the app stops asking you to decide. "I'm flexible" is a real answer.`,
    try:`Tap <b>Add an arrive-by time</b> to bring the line back.` };
  if (state.overrode && linePassed()) return { title:'Waiting anyway',
    what:`You overruled the line. The app states the cost once, then stops asking. The line is a commitment, not a lock.`,
    try:`Tap <b>Next moment</b>, or pick another moment below.` };
  // Only while the rider is still at the settled/moving stage; later moments have their own story.
  if (state.armed && !linePassed() && state.scene <= 1) return { title:'Locked in',
    what:`The card turns solid: the decision is made. From here the app's job is to leave you alone until ${hhmm(theLine())}.`,
    try:`Tap <b>Put my phone away</b>.` };
  return { title: s.label, ...GUIDE[s.id] };
}
function renderGuide() {
  const g = guideFor(), n = state.scene, last = SCENES.length-1;
  $('guide').className = 'guide' + (state.guideOpen ? ' open' : '');
  $('guide').innerHTML = `
    <p class="cap">Prototype walkthrough · ${n+1} of ${SCENES.length}</p>
    <h2 class="g-title">${esc(g.title)}</h2>
    <p class="g-what">${g.what}</p>
    <div class="g-try"><span class="cap">Try</span><p>${g.try}</p></div>
    <button class="g-toggle" data-act="guide-toggle" aria-expanded="${!!state.guideOpen}">${state.guideOpen ? 'Hide explanation' : 'What am I looking at?'}</button>
    <div class="g-nav">
      <button class="g-btn" data-act="prev" ${n===0?'disabled':''} aria-label="Previous moment">←</button>
      <button class="g-btn primary" data-act="${n===last?'restart':'next'}">${n===last ? 'Start again' : 'Next moment →'}</button>
    </div>
    <ol class="g-steps">${SCENES.map((sc,i) => `<li><button class="g-step" data-act="pick-scene" data-v="${i}"
      aria-current="${i===n}"><span class="n">${i+1}</span>${esc(sc.label)}</button></li>`).join('')}</ol>
    <p class="g-foot">Stop 23 and route 470 are real. Every time on screen is simulated.
      <button data-act="about">About this prototype</button></p>`;
}
function goScene(i, focusSel) {
  state.scene = i; state.overrode = false;
  closeSheet(); render();
  announce(`${S().label}. ${S().hint}.`);
  if (focusSel) $('guide').querySelector(focusSel)?.focus();
}

/* ---------- quiet mode: the app's own success condition ---------------- */
function quietView() {
  const l = theLine(), b = backup();
  const passed = linePassed();
  return `
  <div class="quiet-wrap">
    <p class="cap">${ROUTE} · Toowong Village</p>
    ${passed ? `
      <p class="quiet-time">${hhmm(S().now,true)}</p>
      <p class="quiet-msg">Your line has passed.<br><b>Time to walk.</b></p>
      <p class="meta">${esc(b ? b.detail : '')}</p>
    ` : `
      <p class="quiet-time">${hhmm(l,true)}</p>
      <p class="quiet-msg">You're fine until then.<br><b>Put your phone away.</b></p>
      <p class="meta">We'll only interrupt if the bus arrives, or at ${hhmm(l)}.</p>
    `}
    <div class="quiet-acts">
      <button class="btn" data-act="unquiet">${ic('eye')} Show the detail</button>
      ${passed ? `<button class="link" data-act="keep-waiting">Keep waiting</button>` : ''}
    </div>
  </div>`;
}

/* ---------- full view --------------------------------------------------- */
function fullView() {
  return [header(), place(), hero(), busCard(), more(), footer()].join('');
}

function header() {
  return `<div class="top">
    <div class="wordmark"><span class="mark">${ic('bus')}</span><span>wait or go.</span></div>
    <span class="meta num">${hhmm(S().now)}</span>
  </div>`;
}

function place() {
  return `<div class="place">
    <h1>${ic('pin')} Toowong Village</h1>
    <p class="meta">Stop 23 · to the city</p>
  </div>`;
}

/* ---------- THE LINE: the core of the design ---------------------------- */
function byChip() {
  const label = state.deadline === null ? 'Set arrive-by' : `Arrive by ${hhmm(state.deadline)}`;
  return `<button class="by" data-act="goal" aria-haspopup="dialog"
    aria-label="${state.deadline===null?'No arrive-by time set':'Arrive in the city by '+hhmm(state.deadline)}. Change.">${label} ${ic('edit','sm')}</button>`;
}
function planRow(b) {
  return `<div class="plan">${ic('train')}
    <span class="plan-t"><span class="meta">Your backup</span><b>Walk to Auchenflower</b><span class="meta">${esc(b.short)}</span></span>
    <span class="plan-r"><b>${hhmm(b.arrive)}</b><span class="meta">in the city</span></span>
  </div>`;
}

function hero() {
  const b = backup(), l = theLine(), m = minsToLine(), v = busVerdict();

  if (state.deadline === null) {
    // no deadline set: fall back to the frequency argument
    const next = LATER_470.find(t => t > S().now);
    return `<section class="hero none" aria-label="Your waiting line">
      <div class="hero-top"><p class="cap">${ic('flag','sm')} No deadline</p>${byChip()}</div>
      <p class="hero-sub">Flexible trip, so there's no line to draw.${next ? ` If you miss this one, the next ${ROUTE} is <b>${hhmm(next)}</b>.` : ''}</p>
      <button class="btn" data-act="goal">${ic('cal')} Add an arrive-by time</button>
    </section>`;
  }

  if (!b) {
    return `<section class="hero past" aria-label="Your waiting line">
      <div class="hero-top"><p class="cap">${ic('alert','sm')} No backup left</p>${byChip()}</div>
      <p class="hero-sub">Nothing else gets you there by <b>${hhmm(state.deadline)}</b>. Waiting is the only option.</p>
    </section>`;
  }

  /* --- past the line: one decision, and "keep waiting" stays in reach -- */
  if (linePassed() && !state.overrode) {
    const why = v.kind === 'late'
      ? `The bus now makes you <b>${plural(v.slack,'min')} late</b>.`
      : v.kind === 'gone' ? `The ${ROUTE} isn't coming.`
      : `From here the bus can't beat the train.`;
    return `<section class="hero past" aria-label="Your waiting line has passed" id="line">
      <div class="hero-top"><p class="cap">${ic('flag','sm')} ${hhmm(S().now)} · your line</p>${byChip()}</div>
      <p class="hero-time word">Time to walk</p>
      <p class="hero-sub">${why} You set this line before the wait had a hold on you.</p>
      ${planRow(b)}
      <button class="btn" data-act="take-backup">${ic('walk')} Start walking</button>
      <button class="link" data-act="keep-waiting">Keep waiting</button>
    </section>`;
  }

  /* --- they crossed the line and chose to stay ------------------------ */
  if (linePassed() && state.overrode) {
    const a = arrivesCity();
    let cost;
    if (isGone())      cost = `The ${ROUTE} isn't coming. The next one is ${hhmm(LATER_470.find(t=>t>S().now))}.`;
    else if (a===null) cost = `We still can't say when it comes.`;
    else if (a > state.deadline) cost = `The bus makes you ${plural(a-state.deadline,'min')} late.`;
    else cost = `The bus still makes ${hhmm(state.deadline)}.`;
    return `<section class="hero none" aria-label="Past your line, waiting anyway" id="line">
      <div class="hero-top"><p class="cap">${ic('clock','sm')} Past your line</p>${byChip()}</div>
      <p class="hero-time word">Waiting anyway</p>
      <p class="hero-sub">Your call. ${cost} We'll stop asking.</p>
    </section>`;
  }

  /* --- armed: committed, counting down to the line ------------------- */
  if (state.armed) {
    return `<section class="hero armed" aria-label="Your waiting line" id="line">
      <div class="hero-top"><p class="cap">${ic('check','sm')} Locked in</p>${byChip()}</div>
      <div class="hero-row"><p class="hero-time">${hhmm(l,true)}</p><span class="hero-in">in ${plural(m,'min')}</span></div>
      <p class="hero-sub">If the ${ROUTE} hasn't come by then, we'll tell you to walk. <b>Until then, you can stop checking.</b></p>
      ${planRow(b)}
      <button class="btn" data-act="quiet">${ic('moon')} Put my phone away</button>
      <button class="link" data-act="unarm">Undo</button>
    </section>`;
  }

  /* --- default: the line, offered ------------------------------------ */
  // One plain sentence: what the number means, given what the bus is doing.
  const by = hhmm(state.deadline);
  const note = {
    gone:    `The ${ROUTE} isn't coming. Your backup still gets you in before ${by}.`,
    late:    `The bus is now running too late for ${by}. Your backup still makes it.`,
    unknown: `The bus has stopped reporting, but this time doesn't depend on it.`,
    tight:   `The bus only just makes ${by}. If it slips again, take your backup.`,
    fine:    `Waiting for the bus is safe until then. After that, your backup is faster.`
  }[v.kind];

  return `<section class="hero" aria-label="Your waiting line" id="line">
    <div class="hero-top"><p class="cap">${ic('flag','sm')} ${v.kind==='gone' ? 'Leave by' : 'You can wait until'}</p>${byChip()}</div>
    <div class="hero-row"><p class="hero-time">${hhmm(l,true)}</p><span class="hero-in">in ${plural(m,'min')}</span></div>
    <p class="hero-sub">${note}</p>
    ${planRow(b)}
    <button class="btn" data-act="arm">${ic('check')} Hold me to it</button>
    <p class="btn-note">We'll alert you at ${hhmm(l)}, so you can stop checking.</p>
  </section>`;
}

/* The revision trail as bars: one per published estimate, taller = later. */
function sparkBars() {
  const s = S(), d = drift();
  return s.trail.map((p,i) => {
    const prev = i ? s.trail[i-1][1] : p[1];
    const h = 8 + Math.min(40, Math.abs(p[1]-d.first) * 2);
    const cls = p[1] > prev ? 'up' : i === s.trail.length-1 ? 'now' : '';
    return `<i class="${cls}" style="height:${h}px"></i>`;
  }).join('');
}

/* ---------- the bus: the evidence behind the line ----------------------- */
function busCard() {
  const s = S(), d = drift(), gone = isGone(), stale = isStale(), v = busVerdict();

  /* --- state pill: four honest states, never one confident number ----- */
  let pill, pillCls;
  if (gone)            { pill = `${ic('x','sm')} Cancelled`;  pillCls = 'gone'; }
  else if (stale)      { pill = `${ic('gap','sm')} No update`; pillCls = 'stale'; }
  else if (!d.settling){ pill = `${ic('shift','sm')} Moving`;  pillCls = 'drift'; }
  else                 { pill = `${ic('live','sm')} Live`;     pillCls = ''; }

  /* --- left: when it reaches the stop --------------------------------- */
  let left;
  const updated = feedAge() === 0 ? 'updated just now' : `updated ${plural(feedAge(),'min')} ago`;
  if (gone) left = `<span class="meta">This service</span><span class="bus-clock gone">Not running</span>
      <span class="meta">Notice at ${hhmm(s.notice)}</span>`;
  else if (stale) left = `<span class="meta">Last estimate</span><span class="bus-clock unknown">${hhmm(s.arr,true)}</span>
      <span class="meta"><span class="warn">Not current</span> · ${plural(feedAge(),'min')} old</span>`;
  else left = `<span class="meta">At your stop</span><span class="bus-clock">${hhmm(s.arr,true)}</span>
      <span class="meta">in ${plural(s.arr-s.now,'min')} · ${updated}</span>`;

  /* --- right: what it means for the trip (pairs with the line's 3:12) -- */
  const a = arrivesCity();
  const verdict = {
    fine:   `<span class="ok">${plural(v.slack||0,'min')} spare</span>`,
    tight:  `<span class="warn">only just</span>`,
    late:   `<span class="no">${plural(v.slack||0,'min')} late</span>`,
    gone:   `<span class="no">not coming</span>`,
    unknown:`<span class="meta">unknown</span>`,
    nogoal: `<span class="meta">${FARE} fare</span>`
  }[v.kind];
  const right = `<span class="meta">By bus, in the city</span>
    <b>${gone || stale || a===null ? '—' : hhmm(a)}</b>${verdict}`;


  let k, m, tone = '';
  if (gone) {
    k = `Operator notice · ${hhmm(s.notice)}`; m = `Cancelled, not a data gap`; tone = ' gone';
  } else if (stale) {
    k = `Last heard at ${hhmm(s.feed)}`; m = `No update for ${plural(feedAge(),'min')}`;
  } else if (d.moves >= 3) {
    k = `Moved ${d.moves} times in ${plural(d.span,'min')}, all later`;
    m = `${hm(d.first)} ${ic('arrow')} ${hhmm(d.last)} <span class="delta">+${d.total} min</span>`;
    tone = ' warn';
  } else if (d.moves > 0) {
    k = `Moved, then held`;
    m = `${hm(d.first)} ${ic('arrow')} ${hhmm(d.last)} <span class="delta">+${d.total} min</span>`;
  } else {
    k = `Same time, ${s.trail.length} updates`; m = `Steady for ${plural(d.span,'min')}`;
  }
  const plain = (k + '. ' + m).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');

  return `<section class="bus" aria-label="Route ${ROUTE} arrival">
    <div class="bus-top">
      <span class="route">${ROUTE}</span>
      <span class="bus-name">${esc(HEAD)}</span>
      <span class="state ${pillCls}">${pill}</span>
    </div>
    <div class="bus-row"><div class="bus-l">${left}</div><div class="bus-r">${right}</div></div>
    <button class="trail${tone}" data-act="history" aria-haspopup="dialog"
      aria-label="Estimate history. ${esc(plain)}. Open full history.">
      <span class="trail-txt"><span class="trail-k">${k}</span><span class="trail-m">${m}</span></span>
      <span class="trail-go">History ${ic('chev','sm')}</span>
    </button>
  </section>`;
}

/* ---------- everything else, one tap away -------------------------------- */
function more() {
  const later = LATER_470.find(t => t > S().now + 2);
  const bits = [later ? `next ${ROUTE} ${hhmm(later)}` : null, 'walk + train', 'rideshare'].filter(Boolean);
  const txt = bits.join(' · ');
  return `<button class="more" data-act="alts" aria-haspopup="dialog">
    <span class="ic">${ic('route')}</span>
    <span class="more-t"><b>Other ways to get there</b><span class="meta">${txt.charAt(0).toUpperCase()+txt.slice(1)}</span></span>
    ${ic('chev','chev')}
  </button>`;
}

function footer() {
  return `<div class="foot">
    <span>Simulated times</span><span class="dot"></span>
    <button data-act="about">About this demo</button>
  </div>`;
}

/* ========================================================================
   SHEETS
   ====================================================================== */
function openSheet(title, body) {
  lastFocus = document.activeElement;
  $('sheet-title').textContent = title;
  $('sheet-b').innerHTML = body;
  $('sheet').hidden = false; $('shade').hidden = false;
  $('sheet-b').scrollTop = 0;
  state.sheet = title;
  $('sheet-title').focus();
}
function closeSheet() {
  $('sheet').hidden = true; $('shade').hidden = true; state.sheet = null;
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

function sheetHistory() {
  const s = S(), d = drift();
  const rows = s.trail.map((p,i) => {
    const prev = i ? s.trail[i-1][1] : null;
    const delta = prev === null ? null : p[1]-prev;
    return `<div class="r${i===s.trail.length-1?' last':''}">
      <span class="k">${hhmm(p[0])}</span>
      <span class="p">said ${hhmm(p[1])}</span>
      <span class="v ${delta ? 'warn' : 'meta'}">${delta===null?'first':delta===0?'no change':(delta>0?'+':'')+delta+' min'}</span>
    </div>`;
  }).join('');

  const note = isGone()
    ? `<div class="callout">${ic('alert')}<span><b>Cancelled at ${hhmm(s.notice)}.</b> "It isn't coming" and
        "we don't know" call for different decisions, so they look different.</span></div>`
    : isStale()
    ? `<div class="callout">${ic('gap')}<span><b>Nothing new for ${plural(feedAge(),'min')}.</b> The bus may be fine.
        A countdown here would be made up.</span></div>`
    : d.moves >= 3
    ? `<div class="callout">${ic('shift')}<span><b>${d.moves} revisions in ${plural(d.span,'min')}</b>, all later.
        The pattern says more than any one number.</span></div>`
    : `<div class="callout calm">${ic('live')}<span><b>Steady since ${hhmm(d.first)}.</b> A number that stops
        moving usually means a clear run.</span></div>`;

  return `${note}
    <div class="spark" aria-hidden="true">${sparkBars()}</div>
    <p class="cap">Every estimate, newest last</p>
    <div class="rows">${rows}</div>
    <div class="rows">
      <div class="r"><span class="k">Vehicle last reported</span><span class="v ${isStale()?'warn':''}">${hhmm(s.feed)} · ${plural(feedAge(),'min')} ago</span></div>
      <div class="r"><span class="k">Position</span><span class="v">${s.stops===null?'—':`${plural(s.stops,'stop')} away`}</span></div>
      <div class="r"><span class="k">Source</span><span class="v">Operator real-time feed</span></div>
    </div>
    <p class="meta">Other apps overwrite each estimate. It's already in the data; we just keep it.</p>`;
}

function sheetGoal() {
  const opts = [T(14,45),T(15,0),T(15,15),T(15,30),T(16,0)];
  const cur = state.deadline;
  return `<p class="meta">Your line is worked back from this one answer.</p>
    <div class="chips" role="group" aria-label="Arrive-by time">
      ${opts.map(t => `<button class="chip" data-act="pick-goal" data-v="${t}"
        aria-pressed="${cur===t}">${hhmm(t)}</button>`).join('')}
      <button class="chip" data-act="pick-goal" data-v="none" aria-pressed="${cur===null}">I'm flexible</button>
    </div>
    <div class="callout calm">${ic('info')}<span>"I'm flexible" is a real answer. Two of our seven riders
      said a delay barely registers on a casual trip.</span></div>
    <p class="meta">Kept in this tab only. No account, no location, no storage.</p>`;
}

function altOptions() {
  const out = [];
  const s = S();
  if (!isGone()) out.push({
    key:'wait', badge:ROUTE, title:`This ${ROUTE}`,
    sub: isStale() ? `Last said ${hhmm(s.arr)} · not current` : `At the stop ${hhmm(s.arr)}`,
    right: FARE, arrive: isStale() ? null : arrivesCity(), unknown: isStale()
  });
  const nextTrain = TRAINS.find(t => t >= S().now + WALK_TRAIN);
  if (nextTrain) out.push({
    key:'train', icon:'train', title:'Walk + train',
    sub:`${plural(WALK_TRAIN,'min')} walk · ${hhmm(nextTrain)} train`,
    right: FARE, arrive: nextTrain + TRAIN_RIDE
  });
  const later = LATER_470.find(t => t > S().now + 2);
  if (later) out.push({
    key:'later', badge:ROUTE, title:`Next ${ROUTE}`,
    sub:`Timetabled ${hhmm(later)} · same stop`, right: FARE, arrive: later + RIDE
  });
  // rideshare — deliberately last and deliberately priced
  out.push({
    key:'car', icon:'car', title:'Rideshare', cost:true,
    sub:`About ${plural(RIDESHARE.mins,'min')} · ${RIDESHARE.cost}`,
    right: RIDESHARE.cost, arrive: S().now + RIDESHARE.mins
  });
  return out;
}

function sheetAlts() {
  const rows = altOptions().map(o => {
    const makes = state.deadline !== null && o.arrive !== null && o.arrive <= state.deadline;
    const status = o.unknown ? '<span class="meta">unknown</span>'
      : state.deadline === null ? `<span class="meta">${esc(o.right)}</span>`
      : makes ? `<span class="ok">${plural(state.deadline-o.arrive,'min')} spare</span>` : '<span class="no">too late</span>';
    return `<div class="opt">
      <span class="badge">${o.badge ? esc(o.badge) : ic(o.icon)}</span>
      <span class="opt-t"><b>${esc(o.title)}${o.cost?' <span class="tag">costs money</span>':''}</b><span class="meta">${esc(o.sub)}</span></span>
      <span class="opt-r"><b>${o.arrive!==null ? hhmm(o.arrive) : '—'}</b>${status}</span>
    </div>`;
  }).join('');
  return `<p class="meta">Free options first. Times are arrival in the city.</p>
    <div class="rows">${rows}</div>
    <div class="callout">${ic('info')}<span>Rideshare goes last, with its price, because for a lot of
      riders at this stop it isn't an option at all.</span></div>
    <p class="meta">Walk times are demo estimates, not footpath routing.</p>`;
}

function sheetAbout() {
  return `<p><b>wait or go.</b> is a mid-fidelity prototype for DECO2500/7250. A design argument,
    not a transport service.</p>
    <div class="callout">${ic('alert')}<span><b>The times are invented.</b> The stop, route 470 and its
      ~20-minute headway are real. Arrivals, positions, the cancellation and the train link are not.</span></div>
    <p><b>The idea.</b> Arrival estimates will keep being wrong. So show the last moment your backup still
      works, then let people stop looking at their phone.</p>
    <p class="meta">No network requests, no location, no cookies, no storage. Close the tab and nothing survives.</p>`;
}

/* ========================================================================
   ACTIONS
   ====================================================================== */
const ACTIONS = {
  history: () => openSheet('Estimate history', sheetHistory()),
  goal:    () => openSheet('When do you need to be there?', sheetGoal()),
  alts:    () => openSheet('Other ways to get there', sheetAlts()),
  about:   () => openSheet('About this prototype', sheetAbout()),
  close:   () => closeSheet(),

  'pick-scene': el => goScene(+el.dataset.v, `[data-v="${el.dataset.v}"]`),
  next:    () => goScene(Math.min(state.scene+1, SCENES.length-1), '.g-btn.primary'),
  prev:    () => goScene(Math.max(state.scene-1, 0), '[data-act=prev]:not([disabled])') ,
  restart: () => { state.armed = false; state.quiet = false; state.deadline = T(15,15); goScene(0, '.g-btn.primary'); },
  'guide-toggle': () => { state.guideOpen = !state.guideOpen; renderGuide(); $('guide').querySelector('.g-toggle').focus(); },
  'pick-goal': el => {
    const v = el.dataset.v;
    state.deadline = v === 'none' ? null : +v;
    state.armed = false; state.overrode = false;
    closeSheet(); render();
    const l = theLine();
    toast(state.deadline === null ? 'No deadline. Just comparing departures.'
      : l ? `Your line is now ${hhmm(l)}.` : 'No backup gets you there in time.', 'flag');
  },
  arm: () => {
    state.armed = true; render();
    toast(`Locked in. We'll interrupt at ${hhmm(theLine())}, or when the bus comes.`, 'check');
  },
  unarm: () => { state.armed = false; render(); announce('Line unlocked.'); },
  quiet: () => { state.quiet = true; render(); announce('Quiet view. Your line is ' + hhmm(theLine()) + '.'); },
  unquiet: () => { state.quiet = false; render(); },
  'keep-waiting': () => {
    state.overrode = true; state.quiet = false; render();
    toast('OK. We won\'t ask again this trip.', 'info');
  },
  'take-backup': () => {
    const b = backup();
    state.quiet = false;
    openSheet('Walking to Auchenflower', `
      <div class="callout calm">${ic('walk')}<span><b>${plural(WALK_TRAIN,'min')} on foot</b>, then the
        ${hhmm(b.train)} train. In the city at <b>${hhmm(b.arrive)}</b>,
        ${plural(state.deadline-b.arrive,'min')} early.</span></div>
      <p>A full build would hand off to walking directions here. We stop at the decision, because
        that's the part we're testing.</p>
      <p class="meta">If the ${ROUTE} passes you mid-walk, that's the failure we most need to measure.</p>`);
  }
};

/* Optional deep-link, so a particular moment can be opened directly:
   ?scene=3&armed=1&quiet=1&goal=915   (goal in minutes since midnight, or "none") */
(function readURL(){
  const q = new URLSearchParams(location.search);
  if (q.has('scene')) {
    const i = SCENES.findIndex(s => s.id === q.get('scene'));
    const n = i >= 0 ? i : parseInt(q.get('scene'),10);
    if (Number.isInteger(n) && n >= 0 && n < SCENES.length) state.scene = n;
  }
  if (q.has('goal')) state.deadline = q.get('goal') === 'none' ? null : parseInt(q.get('goal'),10);
  if (q.get('armed') === '1') state.armed = true;
  if (q.get('quiet') === '1') { state.armed = true; state.quiet = true; }
  if (q.get('waiting') === '1') state.overrode = true;
  if (q.get('guide') === '0') $('stage').classList.add('no-guide');
})();

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.sheet) { e.preventDefault(); closeSheet(); }
});

render();
</script>
</body>
</html>
